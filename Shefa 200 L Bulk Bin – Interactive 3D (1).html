<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Shefa 200 L Bulk Bin – Interactive 3D</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Lora:wght@500&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg1:#F8FAFD;--bg2:#CFDAE7;--card:rgba(255,255,255,.9);--ink:#0B2342;--mut:#5A6A7D;--line:rgba(11,35,66,.14);--acc:#D9161C;--chip:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#1A3858;--bg2:#06122A;--card:rgba(10,26,50,.88);--ink:#EEF3F9;--mut:#A9B8CA;--line:rgba(255,255,255,.16);--chip:#13294A}}
:root[data-theme="dark"]{--bg1:#1A3858;--bg2:#06122A;--card:rgba(10,26,50,.88);--ink:#EEF3F9;--mut:#A9B8CA;--line:rgba(255,255,255,.16);--chip:#13294A}
html,body{height:100%;margin:0;overflow:hidden}
body{background:radial-gradient(120% 90% at 50% 30%,var(--bg1),var(--bg2));color:var(--ink);font-family:Poppins,system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
body.ar{background:#000}
#cam{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;display:none}
#c{position:fixed;inset:0;width:100%;height:100%;touch-action:none;outline:0}
#top{position:fixed;left:12px;right:12px;top:calc(env(safe-area-inset-top,0px) + 10px);display:flex;align-items:center;gap:8px;z-index:5}
#top img{height:30px;filter:drop-shadow(0 1px 2px rgba(0,0,0,.15))}.sp{flex:1}
button{font:500 12px Poppins,system-ui,sans-serif;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:999px;padding:9px 14px;cursor:pointer;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
button.p{background:var(--acc);color:#fff;border-color:transparent}button:active{transform:scale(.97)}
#tags{position:fixed;inset:0;pointer-events:none;z-index:3}
.hs{position:absolute;width:30px;height:30px;margin:-15px;border-radius:50%;background:var(--acc);border:3px solid #fff;pointer-events:auto;padding:0;box-shadow:0 0 0 0 rgba(217,22,28,.6);animation:pl 2s infinite}
.hs.on{background:var(--ink)}
@keyframes pl{70%{box-shadow:0 0 0 14px rgba(217,22,28,0)}100%{box-shadow:0 0 0 0 rgba(217,22,28,0)}}
.lb{position:absolute;transform:translate(-50%,-100%);font:500 10px Poppins;letter-spacing:.14em;text-transform:uppercase;color:var(--ink);background:var(--card);padding:5px 9px;border-radius:6px;border:1px solid var(--line);white-space:nowrap}
#card{position:fixed;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 66px);max-width:520px;margin:auto;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 16px;z-index:5;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 12px 34px rgba(0,0,0,.18)}
#card h2{font:500 20px Lora,Georgia,serif;margin:0 0 4px}#card p{margin:0;font-size:12.5px;line-height:1.55;color:var(--mut)}
#ctl{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}#ctl:empty{display:none}
#tabs{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 10px);display:flex;gap:8px;overflow-x:auto;padding:0 12px;z-index:5;justify-content:safe center;scrollbar-width:none}
#tabs button{flex:none}#tabs button.on{background:var(--ink);color:var(--bg1);border-color:transparent}
body.ar #card,body.ar #tabs{opacity:.92}
#intro{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;background:radial-gradient(120% 90% at 50% 30%,#1B3C63,#06122A);color:#fff;transition:opacity .6s}
#intro img{width:min(260px,70vw);background:#fff;border-radius:14px;padding:14px 18px}
#intro h1{font:500 clamp(26px,6vw,40px) Lora,Georgia,serif;margin:26px 0 8px}#intro p{margin:0 0 26px;font-size:13px;color:#B9C6D6;max-width:340px;line-height:1.6}
#intro .eb{font:500 10px Poppins;letter-spacing:.28em;color:#FF6B6F;margin-top:26px}
#toast{position:fixed;top:64px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg1);font-size:12px;padding:8px 14px;border-radius:10px;z-index:9;opacity:0;transition:opacity .3s;pointer-events:none;max-width:86vw;text-align:center}
</style></head><body>

if(i==1){const d=M(new T.CylinderGeometry(.62,.62,1.2,40),dark,[0,.95,-1.7]);d.rotation.z=Math.PI/2;g.add(d,M(new T.BoxGeometry(1.6,.5,1),dark,[0,.25,-1.7]))}
if(i==2){g.add(M(new T.BoxGeometry(1.5,.8,1),dark,[0,.4,-1.7]),M(new T.BoxGeometry(.12,1.4,.12),dark,[-.5,1.5,-1.7]),M(new T.BoxGeometry(.12,1.4,.12),dark,[.5,1.5,-1.7]),M(new T.BoxGeometry(1.2,.4,.6),dark,[0,2.2,-1.7]))}
if(i==3){g.add(M(new T.BoxGeometry(1.4,1.5,1),dark,[0,.75,-1.7]),M(new T.CylinderGeometry(.75,.25,.7,32),dark,[0,1.85,-1.7]))}
g.position.x=x;stat.add(g)});
const tween=[];function tw(o,p,to,ms=700,cb){tween.push({o,p,to,ms,t0:performance.now(),f:o[p],cb})}
const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
const G={th:.55,ph:.32,d:7.2,tx:0,ty:.75,tz:0},C={...G};let auto=true,idle=0,xrOn=false;
const HS=[{t:'Dust-tight lid',x:'A sealed lid with toggle latches keeps product contained and cuts operator exposure.',p:[0,FT+Hb+LH+.1,Wd/2],v:{th:.25,ph:.7,d:4.2}},
{t:'Toggle latches',x:'Secure latches at both ends hold the lid shut during transfer and stacking.',p:[L/2+.08,FT+Hb-.1,0],v:{th:1.35,ph:.18,d:3.4}},
{t:'Stacker-ready base',x:'A raised base for lifts and stackers. Stack up to three bins high to save floor and inventory space.',p:[L/2-.25,FT*.5,Wd/2-.1],v:{th:.65,ph:.04,d:3.6}},
{t:'200 L capacity',x:'Holds 120–140 kg of tablets, so one bin replaces many 25/30 L containers per batch.',p:[-.95,FT+Hb*.55,Wd/2+.04],v:{th:-.2,ph:.12,d:4.4}}];
const tags=$('#tags');let mode='';
function clearTags(){tags.innerHTML=''}
function addHS(){clearTags();HS.forEach((h,i)=>{const b=document.createElement('button');b.className='hs';b.setAttribute('aria-label',h.t);b.style.cssText='';h.el=b;b.onclick=()=>{sTap();HS.forEach(k=>k.el.classList.remove('on'));b.classList.add('on');Object.assign(G,h.v,{tx:0,ty:.75});auto=false;info(h.t,h.x)};tags.appendChild(b)})}
function info(t,x){$('#ct').textContent=t;$('#cx').textContent=x}
function btn(l,f,p){const b=document.createElement('button');b.textContent=l;if(p)b.className='p';b.onclick=()=>{f();};$('#ctl').appendChild(b);return b}
const MODES={explore:'Explore',fill:'Open & fill',stack:'Stack',compare:'Compare',where:'Where used'};
Object.entries(MODES).forEach(([k,v])=>{const b=document.createElement('button');b.textContent=v;b.dataset.m=k;b.onclick=()=>{sMode();setMode(k)};$('#tabs').appendChild(b)});
function reset(){clearTags();$('#ctl').innerHTML='';bins.forEach((b,i)=>{b.position.set(0,0,0);b.visible=i==0;b.userData.lp.rotation.x=0});bin.userData.tabs.count=0;bin.userData.fill=0;stream.visible=false;crates.visible=false;stat.visible=false;auto=false}
function setMode(m){mode=m;document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.m==m));reset();
if(m=='explore'){addHS();auto=true;Object.assign(G,{th:.55,ph:.32,d:7.2,tx:0,ty:.75,tz:0});info('Explore the bin','Drag to rotate, pinch or scroll to zoom. Tap a glowing dot to see a key feature.')}
if(m=='fill'){Object.assign(G,{th:.4,ph:.62,d:5.6,tx:0,ty:.6,tz:0});info('Open, fill, discharge','A dust-tight lid on top, and partial discharge so you take only what the process needs.');
btn('Open lid',()=>{sClick();tw(bin.userData.lp.rotation,'x',-1.25,900)});btn('Pour tablets',pour,1);btn('Take a partial batch',()=>{hiss(.9,.035,1800);tw(bin.userData,'fill',Math.max(0,bin.userData.fill-.3),1400)});btn('Close lid',()=>{tw(bin.userData.lp.rotation,'x',0,900,sClick)})}
if(m=='stack'){Object.assign(G,{th:.6,ph:.2,d:10.5,tx:0,ty:1.9,tz:0});info('Stack three high','Stack up to three bins high to save floor and inventory space.');
btn('Stack them',()=>{[1,2].forEach(k=>{const b=bins[k];b.visible=true;b.position.y=7;setTimeout(()=>{tw(b.position,'y',k*TOP,900,()=>{tone(150,.12,'triangle',.08,70);sClick()})},(k-1)*750)})},1);btn('Unstack',()=>{[1,2].forEach(k=>tw(bins[k].position,'y',7,600,()=>bins[k].visible=false))})}
if(m=='compare'){crates.visible=true;crates.children.forEach((c,i)=>{c.scale.setScalar(.01);setTimeout(()=>{tw(c.scale,'x',1,300);tw(c.scale,'y',1,300);tw(c.scale,'z',1,300,()=>tone(500+i*60,.07,'sine',.04))},350+i*160)});Object.assign(G,{th:.35,ph:.3,d:11,tx:-1.5,ty:.5,tz:0});info('One bin vs small containers','A 200 L Shefa bin holds as much as roughly 7–8 traditional 25/30 L containers, with fewer bins to handle and less manual effort.')}
if(m=='where'){stat.visible=true;auto=false;btn('1 Press',()=>go(0));btn('2 Coating',()=>go(1));btn('3 Inspection',()=>go(2));btn('4 Packing',()=>go(3));go(0)}}
const STX=[['Tablet press','Tablets drop straight from the press discharge into the bin for collection.'],['Coating','Feed tablets to the coater from a height-adjustable stacker, then collect the coated batch.'],['Automatic inspection','Load and unload tablets for automatic inspection with minimal handling.'],['Packing','Supply the packing machine from a height-adjustable stacker with bulk-loaded tablets.']];
function go(i){tone(520+i*110,.14,'sine',.05);const x=ST[i];tw(bin.position,'x',x,1100,()=>sClick());Object.assign(G,{th:.3,ph:.28,d:8.5,tx:x,ty:.9,tz:0});stat.children.forEach((g,k)=>g.userData.r.material.opacity=k==i?.9:.2);info((i+1)+'. '+STX[i][0],STX[i][1])}
function pour(){const u=bin.userData;if(u.lp.rotation.x>-1)tw(u.lp.rotation,'x',-1.25,800);stream.visible=true;hiss(3.4,.03,2600);tw(u,'fill',1,3600,()=>stream.visible=false)}
// camera + input
const ptr=new Map();let pd=0;
cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);ptr.set(e.pointerId,[e.clientX,e.clientY]);auto=false;if(ptr.size==2){const a=[...ptr.values()];pd=Math.hypot(a[0][0]-a[1][0],a[0][1]-a[1][1])}});
cv.addEventListener('pointermove',e=>{if(!ptr.has(e.pointerId))return;const o=ptr.get(e.pointerId);if(ptr.size==1){G.th-=(e.clientX-o[0])*.006;G.ph=Math.max(.02,Math.min(1.35,G.ph+(e.clientY-o[1])*.005))}ptr.set(e.pointerId,[e.clientX,e.clientY]);if(ptr.size==2){const a=[...ptr.values()],d=Math.hypot(a[0][0]-a[1][0],a[0][1]-a[1][1]);G.d=Math.max(2.8,Math.min(16,G.d*pd/d));pd=d}});
['pointerup','pointercancel'].forEach(n=>cv.addEventListener(n,e=>ptr.delete(e.pointerId)));
cv.addEventListener('wheel',e=>{e.preventDefault();G.d=Math.max(2.8,Math.min(16,G.d*(1+e.deltaY*.001)))},{passive:false});
function size(){const w=innerWidth,h=innerHeight;R.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix()}addEventListener('resize',size);size();
const v3=new T.Vector3();function proj(p,o){v3.set(...p);o.localToWorld(v3);v3.project(cam);return [(v3.x*.5+.5)*innerWidth,(-v3.y*.5+.5)*innerHeight,v3.z<1]}
// AR
let hitSrc=null,reticle=null,camStream=null;
reticle=new T.Mesh(new T.RingGeometry(.12,.16,32).rotateX(-Math.PI/2),new T.MeshBasicMaterial({color:0xd9161c}));reticle.matrixAutoUpdate=false;reticle.visible=false;scene.add(reticle);
const REAL=0.5; /* scene units to metres: bin is 2 units long = 1.0 m. Update once final dimensions are confirmed. */
async function startAR(){let ok=false;try{ok=navigator.xr&&await navigator.xr.isSessionSupported('immersive-ar')}catch(e){}
if(ok){try{const s=await navigator.xr.requestSession('immersive-ar',{requiredFeatures:['hit-test'],optionalFeatures:['dom-overlay'],domOverlay:{root:document.body}});R.xr.enabled=true;R.xr.setReferenceSpaceType('local');await R.xr.setSession(s);const vs=await s.requestReferenceSpace('viewer');hitSrc=await s.requestHitTestSource({space:vs});xrOn=true;W.scale.setScalar(REAL);W.visible=false;floor.scale.setScalar(1);toast('Move your phone slowly, then tap the floor to place the bin');
s.addEventListener('select',()=>{if(reticle.visible){W.position.setFromMatrixPosition(reticle.matrix);W.visible=true;sClick()}});
s.addEventListener('end',()=>{R.xr.enabled=false;xrOn=false;hitSrc=null;reticle.visible=false;W.visible=true;W.scale.setScalar(1);W.position.set(0,0,0);size()});return}catch(e){}}
try{camStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'},audio:false});const v=$('#cam');v.srcObject=camStream;v.style.display='block';document.body.classList.add('ar');W.scale.setScalar(.7);$('#ar').textContent='Exit AR';toast('Camera view: drag to rotate, pinch to resize');$('#ar').onclick=exitAR}catch(e){toast('Camera access was not allowed. You can still explore the bin in 3D.')}}
function exitAR(){if(camStream)camStream.getTracks().forEach(t=>t.stop());camStream=null;$('#cam').style.display='none';document.body.classList.remove('ar');W.scale.setScalar(1);$('#ar').textContent='View in your space';$('#ar').onclick=startAR}
$('#ar').onclick=startAR;
// loop
R.setAnimationLoop((t,frame)=>{const now=performance.now();
for(let i=tween.length-1;i>=0;i--){const w=tween[i],k=Math.min(1,(now-w.t0)/w.ms);w.o[w.p]=w.f+(w.to-w.f)*ease(k);if(k>=1){tween.splice(i,1);w.cb&&w.cb()}}
bins.forEach(b=>{const u=b.userData;u.tabs.count=Math.floor(N*u.fill)});
if(stream.visible){const m=new T.Matrix4(),y0=FT+Hb+.2,y1=FT+TH+.05+bin.userData.fill*.86*Hb;for(let i=0;i<40;i++){const p=((now*.0011+i/40)%1);m.setPosition(((i*37)%11-5)*.012,3.6-(3.6-y1)*p,((i*53)%9-4)*.012);stream.setMatrixAt(i,m)}stream.instanceMatrix.needsUpdate=true}
if(frame&&hitSrc){const hr=frame.getHitTestResults(hitSrc);if(hr.length){reticle.visible=true;reticle.matrix.fromArray(hr[0].getPose(R.xr.getReferenceSpace()).transform.matrix)}else reticle.visible=false}
if(!xrOn){if(auto&&mode=='explore'){G.th+=.0035}for(const k of['th','ph','d','tx','ty','tz'])C[k]+=(G[k]-C[k])*.085;const cp=Math.cos(C.ph);cam.position.set(C.tx+C.d*cp*Math.sin(C.th),C.ty+C.d*Math.sin(C.ph),C.tz+C.d*cp*Math.cos(C.th));cam.lookAt(C.tx,C.ty,C.tz)}
if(mode=='explore'&&!xrOn)HS.forEach(h=>{if(!h.el)return;const p=proj(h.p,bin);h.el.style.display=p[2]?'block':'none';h.el.style.left=p[0]+'px';h.el.style.top=p[1]+'px'});
R.render(scene,cam)});
